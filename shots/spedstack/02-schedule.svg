    <line x1="40" y1="198" x2="1160" y2="198"/><line x1="40" y1="270" x2="1160" y2="270"/>
    <line x1="40" y1="342" x2="1160" y2="342"/><line x1="40" y1="414" x2="1160" y2="414"/>
