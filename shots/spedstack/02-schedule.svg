  <rect x="40" y="152" width="1120" height="406" fill="none" stroke="#d8dbdd" stroke-width="1.2"/>

  <text x="40" y="596" font-size="12.5" fill="#8a8a8a">A week of this is built from the imported instructional plans rather than assembled by hand. The engine groups students, ranks the</text>
  <text x="40" y="616" font-size="12.5" fill="#8a8a8a">candidate placements and fills the grid; a person reviews the result and overrides it where the judgement is theirs to make.</text>
  <text x="40" y="650" font-size="12.5" fill="#8a8a8a">The real interface renders live operational data and so is never shown. The layout above is mine; the content is not anyone&#8217;s.</text>
</svg>
